name: 🐞 Test Defect
description: Report a defect found during testing
title: "[Defect] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The more detail you provide, the faster we can triage and fix.
        Please search existing issues first to avoid duplicates.

  - type: input
    id: version
    attributes:
      label: Product version / build
      description: e.g. v2.3.1 (build 1024)
      placeholder: v2.3.1 (build 1024)
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - iOS
        - Android
        - Web - Chrome
        - Web - Safari
        - Web - Other browser
        - Windows desktop
        - macOS desktop
        - Backend / API
        - Other
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: Module / area
      description: e.g. Sign-in, Checkout, Push notifications
      placeholder: Checkout
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Definitions are in the README
      options:
        - P0 - Blocker (crash / main flow unusable / data loss)
        - P1 - Critical (major function broken, no workaround)
        - P2 - Normal (function broken, workaround exists)
        - P3 - Minor (UI, copy or polish issue)
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Defect type
      options:
        - Functional
        - Crash / freeze
        - Performance
        - UI / interaction
        - Compatibility
        - Security
        - Data / API
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, including preconditions and test data
      placeholder: |
        Precondition: signed in as test001
        1. Open "Orders"
        2. Tap "Pay now"
        3. Select card and confirm
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility
      options:
        - Always (10/10)
        - High (~70%)
        - Medium (~30%)
        - Low (<10%)
        - Seen once, not reproducible
    validations:
      required: true

  - type: textarea
    id: attachment
    attributes:
      label: Screenshots / screen recording
      description: Drag and drop images here
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / request-response / additional context
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
